name: Temporary repair verification and export

on:
  push:
    branches: [main]

jobs:
  verify-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/patchbay-critical-fixes-20261019

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -e ".[test]"
      - run: python -m compileall src scripts tests
      - run: python -m pytest tests -q

      - name: Write verification metadata
        if: always()
        run: |
          printf '%s\n' \
            'Repair branch: chatgpt/patchbay-critical-fixes-20261019' \
            "Repair commit: $(git rev-parse HEAD)" \
            "Workflow run: $GITHUB_RUN_ID" \
            > VERIFICATION-CI.txt

      - name: Upload tested source tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PatchBay-repaired-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
