name: CI

on:
  pull_request:
  push:
    branches: [main, chatgpt/source-export-20261019]

jobs:
  python-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Export exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: patchbay-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip

      - run: pip install -r requirements.txt -e ".[test]"

      - run: python -m compileall src scripts tests

      - run: python -m pytest tests -q
