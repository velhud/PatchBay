name: Author Mode validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'author-mode/implementation-*'
      - 'chatgpt/patchbay-unified-reconciliation-*'
  pull_request:
    paths:
      - 'src/patchbay/authoring/**'
      - 'src/patchbay/mcp_versions.py'
      - 'tests/authoring/**'
      - '.github/workflows/author-mode-validation.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  author-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact baseline source
        run: |
          mkdir -p "$RUNNER_TEMP/patchbay-delivery"
          git archive --format=zip --prefix=PatchBay/ 678aa3ff93dda5cbfd2c517234504170d4cd3db7 -o "$RUNNER_TEMP/patchbay-delivery/PatchBay-baseline-678aa3ff.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/patchbay-delivery/VALIDATED_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PatchBay-baseline-678aa3ff
          path: ${{ runner.temp }}/patchbay-delivery/PatchBay-baseline-678aa3ff.zip
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned project and test dependencies
        run: python -m pip install -r requirements.txt -e '.[test]'
      - name: Compile source and tests
        run: python -m compileall -q src scripts tests
      - name: Run deterministic regression suite
        run: |
          set -o pipefail
          python -m pytest tests -q --junitxml="$RUNNER_TEMP/patchbay-delivery/tests.xml" 2>&1 | tee "$RUNNER_TEMP/patchbay-delivery/tests.log"
      - name: Archive complete candidate
        if: always()
        run: |
          git archive --format=zip --prefix=PatchBay/ HEAD -o "$RUNNER_TEMP/patchbay-delivery/PatchBay-Author-Mode-source.zip"
          cd "$RUNNER_TEMP/patchbay-delivery"
          sha256sum PatchBay-Author-Mode-source.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PatchBay-Author-Mode-${{ github.sha }}
          path: ${{ runner.temp }}/patchbay-delivery/
          retention-days: 14
